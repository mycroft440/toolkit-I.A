services:
  vllm:
    image: "${VLLM_IMAGE:-vllm/vllm-openai:glm53-flash}"
    container_name: glm53-flash-vllm
    restart: unless-stopped
    privileged: true
    ipc: host
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: "${HF_TOKEN:-}"
      VLLM_API_KEY: "${API_KEY}"
      VLLM_ENGINE_READY_TIMEOUT_S: "${VLLM_ENGINE_READY_TIMEOUT_S:-3600}"
      VLLM_MEDIA_URL_ALLOW_REDIRECTS: "${VLLM_MEDIA_URL_ALLOW_REDIRECTS:-0}"
      VLLM_CACHE_ROOT: /root/.cache/vllm
    volumes:
      - "${HF_CACHE_DIR:-/var/lib/glm53/huggingface}:/root/.cache/huggingface"
      - "${VLLM_CACHE_DIR:-/var/lib/glm53/vllm-cache}:/root/.cache/vllm"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "${MODEL_ID:-zai-org/GLM-5.3-Flash}"
      - --revision
      - "${MODEL_REVISION:-main}"
      - --tokenizer-revision
      - "${MODEL_REVISION:-main}"
      - --tensor-parallel-size
      - "${TENSOR_PARALLEL_SIZE:-8}"
      - --max-model-len
      - "${MAX_MODEL_LEN:-262144}"
      - --no-enable-flashinfer-autotune
      - --tool-call-parser
      - glm47
      - --enable-auto-tool-choice
      - --reasoning-parser
      - glm45
      - --served-model-name
      - "${SERVED_MODEL_NAME:-glm-5.3-flash}"
      - --allowed-media-domains
      - "${ALLOWED_MEDIA_DOMAIN:-media.invalid}"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - glm-internal

  gateway:
    image: nginx:1.29-alpine
    container_name: glm53-flash-gateway
    restart: unless-stopped
    depends_on:
      - vllm
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - glm-internal

networks:
  glm-internal:
    driver: bridge
