name: GLM 5.3 Flash server CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'glm-5.3-flash-server/**'
      - '.github/workflows/glm53-flash-server-ci.yml'
  pull_request:
    paths:
      - 'glm-5.3-flash-server/**'
      - '.github/workflows/glm53-flash-server-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glm-5.3-flash-server
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n install.sh manage.sh info healthcheck.sh test-api.sh scripts/*.sh
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install.sh manage.sh info healthcheck.sh test-api.sh scripts/*.sh
      - name: Global info symlink regression
        run: |
          test -x info
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/project" "$tmpdir/bin"
          cp info "$tmpdir/project/info"
          chmod +x "$tmpdir/project/info"
          cat >"$tmpdir/project/manage.sh" <<'EOF'
          #!/usr/bin/env bash
          printf 'MANAGE:%s\n' "$1"
          EOF
          chmod +x "$tmpdir/project/manage.sh"
          ln -s "$tmpdir/project/info" "$tmpdir/bin/glm-info"
          test "$("$tmpdir/bin/glm-info")" = "MANAGE:info"
      - name: Compose syntax
        run: |
          cp .env.example .env
          sed -i 's/^API_KEY=.*/API_KEY=ci-test-key/' .env
          docker compose --env-file .env config >/dev/null
      - name: Nginx syntax
        run: |
          docker run --rm \
            --add-host vllm:127.0.0.1 \
            -v "$PWD/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.29-alpine nginx -t
